<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="1020" height="500" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1020" height="500" rx="12" fill="#0d1117" />

  <!-- ================= DOMAIN 1: 230V AC ================= -->
  <rect x="24" y="24" width="320" height="452" rx="10" fill="#1c1414" stroke="#f85149" stroke-width="2" />
  <text x="184" y="52" fill="#ff7b72" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">230V AC MAINS DOMAIN</text>

  <!-- J1: AC IN -->
  <rect x="44" y="72" width="280" height="62" rx="6" fill="#281a1a" stroke="#f85149" stroke-width="1.5" />
  <text x="184" y="98" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">J1: 230V AC IN (L / N / PE)</text>
  <text x="184" y="118" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">Main Fuse FH1 + MOV Surge</text>

  <!-- Cascading AC Bus Trunk -->
  <line x1="76" y1="134" x2="76" y2="418" stroke="#f85149" stroke-width="3" />
  <circle cx="76" cy="158" r="4" fill="#f85149" />
  <circle cx="76" cy="222" r="4" fill="#f85149" />
  <circle cx="76" cy="306" r="4" fill="#f85149" />
  <circle cx="76" cy="418" r="4" fill="#f85149" />

  <!-- Branch to PSU 1 (Logic) -->
  <line x1="76" y1="158" x2="438" y2="158" stroke="#f85149" stroke-width="2.5" />
  <polygon points="444,158 435,153 435,163" fill="#f85149" />

  <!-- Branch to Motor -->
  <line x1="76" y1="222" x2="104" y2="222" stroke="#f85149" stroke-width="2.5" />
  <polygon points="110,222 101,217 101,227" fill="#f85149" />

  <rect x="110" y="185" width="214" height="74" rx="6" fill="#281a1a" stroke="#f85149" stroke-width="1.5" />
  <text x="217" y="210" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">J2: MOTOR (OPEN/CLOSE)</text>
  <text x="217" y="229" fill="#ff7b72" font-size="11.5" font-weight="600" text-anchor="middle">Fuse FH2 + Interlocked Relays</text>
  <text x="217" y="246" fill="#8b949e" font-size="11" text-anchor="middle">+ RC Snubbers</text>

  <!-- Branch to LAMP / AUX -->
  <line x1="76" y1="306" x2="104" y2="306" stroke="#f85149" stroke-width="2.5" />
  <polygon points="110,306 101,301 101,311" fill="#f85149" />

  <rect x="110" y="272" width="214" height="74" rx="6" fill="#281a1a" stroke="#f85149" stroke-width="1.5" />
  <text x="217" y="297" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">J3: LAMP + AUX</text>
  <text x="217" y="316" fill="#ff7b72" font-size="11.5" font-weight="600" text-anchor="middle">Fuses FH3/FH4 + Isolated SSRs</text>
  <text x="217" y="333" fill="#8b949e" font-size="11" text-anchor="middle">+ Output MOVs</text>

  <!-- Branch to PSU 2 (24V Field) -->
  <line x1="76" y1="418" x2="438" y2="418" stroke="#f85149" stroke-width="2.5" />
  <polygon points="444,418 435,413 435,423" fill="#f85149" />

  <!-- ================= BARRIER 1: PCB MILLING ================= -->
  <line x1="364" y1="24" x2="364" y2="476" stroke="#d29922" stroke-width="3" stroke-dasharray="10,8" />
  <rect x="344" y="190" width="40" height="125" rx="4" fill="#0d1117" />
  <text x="364" y="253" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90 364 253)" letter-spacing="1.5">PCB MILLING</text>

  <!-- ================= BARRIER 2: OUTPUT OPTO-ISOLATION ================= -->
  <line x1="412" y1="180" x2="412" y2="355" stroke="#3fb950" stroke-width="3" stroke-dasharray="8,6" />
  <rect x="394" y="205" width="36" height="125" rx="4" fill="#0d1117" />
  <text x="412" y="268" fill="#56d364" font-size="10.5" font-weight="700" text-anchor="middle" transform="rotate(-90 412 268)" letter-spacing="1.2">OPTO-ISOLATED</text>

  <!-- ================= DOMAIN 2: 3.3V LOGIC ================= -->
  <rect x="444" y="24" width="224" height="326" rx="10" fill="#121d2f" stroke="#58a6ff" stroke-width="2" />
  <text x="556" y="52" fill="#79c0ff" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">3.3V LOGIC DOMAIN</text>

  <!-- Isolated Logic PSU -->
  <rect x="462" y="124" width="188" height="62" rx="6" fill="#18273f" stroke="#58a6ff" stroke-width="1.5" />
  <text x="556" y="149" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">Isolated Logic PSU</text>
  <text x="556" y="168" fill="#79c0ff" font-size="11.5" text-anchor="middle">230V AC → 3.3V Logic Rail</text>

  <!-- Arrow PSU -> ESP32 -->
  <line x1="556" y1="186" x2="556" y2="208" stroke="#58a6ff" stroke-width="2" />
  <polygon points="556,214 551,205 561,205" fill="#58a6ff" />

  <!-- ESP32-S3 Core -->
  <rect x="462" y="214" width="188" height="118" rx="6" fill="#18273f" stroke="#58a6ff" stroke-width="1.5" />
  <text x="556" y="248" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">ESP32-S3</text>
  <text x="556" y="268" fill="#79c0ff" font-size="12" text-anchor="middle">ESPHome Core</text>
  <text x="556" y="290" fill="#8b949e" font-size="11" text-anchor="middle">100% Opto-Isolated</text>
  <text x="556" y="306" fill="#8b949e" font-size="11" text-anchor="middle">Inputs + Outputs</text>

  <!-- Opto-Isolated Output Control Arrows (ESP32 -> Opto Barrier -> Milling -> Relays/SSRs) -->
  <path d="M 462 232 L 330 232" stroke="#3fb950" stroke-width="2.5" fill="none" />
  <polygon points="324,232 333,227 333,237" fill="#3fb950" />

  <path d="M 462 308 L 330 308" stroke="#3fb950" stroke-width="2.5" fill="none" />
  <polygon points="324,308 333,303 333,313" fill="#3fb950" />

  <!-- ================= ISOLATED 24V PSU (SEPARATE RAIL) ================= -->
  <rect x="444" y="368" width="224" height="108" rx="10" fill="#141e1a" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="556" y="390" fill="#56d364" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">SEPARATE FIELD SUPPLY</text>
  <rect x="462" y="400" width="188" height="60" rx="6" fill="#172d1e" stroke="#3fb950" stroke-width="1.5" />
  <text x="556" y="424" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">Mean Well IRM-10-24</text>
  <text x="556" y="443" fill="#56d364" font-size="11.5" text-anchor="middle">230V AC → Isolated 24V DC</text>

  <!-- ================= BARRIER 3: INPUT OPTO-ISOLATION ================= -->
  <line x1="704" y1="24" x2="704" y2="476" stroke="#3fb950" stroke-width="3" stroke-dasharray="10,8" />
  <rect x="684" y="135" width="40" height="145" rx="4" fill="#0d1117" />
  <text x="704" y="208" fill="#56d364" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90 704 208)" letter-spacing="1.5">OPTO-ISOLATION</text>

  <!-- ================= DOMAIN 3: 24V FIELD ================= -->
  <rect x="732" y="24" width="264" height="452" rx="10" fill="#122117" stroke="#3fb950" stroke-width="2" />
  <text x="864" y="52" fill="#56d364" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">24V FIELD DOMAIN</text>

  <!-- 6x Opto Inputs -->
  <rect x="752" y="140" width="224" height="190" rx="6" fill="#172d1e" stroke="#3fb950" stroke-width="1.5" />
  <text x="864" y="170" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">6× OPTO INPUTS</text>
  <text x="864" y="200" fill="#c9d1d9" font-size="12" text-anchor="middle">• J5: Photocells (P1, P2)</text>
  <text x="864" y="228" fill="#c9d1d9" font-size="12" text-anchor="middle">• J6: Limit Switches (L1, L2)</text>
  <text x="864" y="256" fill="#c9d1d9" font-size="12" text-anchor="middle">• J7: Buttons (B1, B2)</text>
  <text x="864" y="294" fill="#56d364" font-size="11.5" font-weight="600" text-anchor="middle">6× LTV-847S Barrier</text>

  <!-- +24V Field Out -->
  <rect x="752" y="384" width="224" height="68" rx="6" fill="#172d1e" stroke="#3fb950" stroke-width="1.5" />
  <text x="864" y="412" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">J4: +24V FIELD OUT</text>
  <text x="864" y="432" fill="#56d364" font-size="11.5" text-anchor="middle">Isolated Sensor Power</text>

  <!-- Arrow 24V PSU -> J4 Field Out -->
  <line x1="650" y1="428" x2="746" y2="428" stroke="#3fb950" stroke-width="2.5" />
  <polygon points="752,428 743,423 743,433" fill="#3fb950" />

  <!-- Arrow Field Inputs -> ESP32 (across Opto Barrier) -->
  <path d="M 752 268 L 656 268" stroke="#3fb950" stroke-width="2.5" fill="none" />
  <polygon points="650,268 659,263 659,273" fill="#3fb950" />
</svg>